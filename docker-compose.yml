services:
  kwings-mail:
    build: .
    image: kwings-mail:local
    restart: unless-stopped
    ports:
      - "3000:3000"   # web app and JMAP
      - "25:25"       # inbound SMTP (point your domain's MX here)
    env_file: .env.docker
    volumes:
      - kwings-mail-data:/data

volumes:
  kwings-mail-data:
